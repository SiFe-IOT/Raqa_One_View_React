# Project-wide Gradle settings.

# Specifies the JVM arguments used for the daemon process.
# Raised from 2048m: RN 0.87 + Kotlin 2.2 + 4 ABIs needs more headroom.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m

# Speed: build independent modules in parallel and reuse task outputs.
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true

# Build only 64-bit ARM (nearly all real phones).
# Use armeabi-v7a,arm64-v8a,x86,x86_64 for a Play Store release,
# or x86_64 if you test the release build on an emulator.
#reactNativeArchitectures=armeabi-v7a,arm64-v8a
reactNativeArchitectures=armeabi-v7a

newArchEnabled=true
hermesEnabled=true
edgeToEdgeEnabled=true

# Opt out of built-in kotlin and new DSL behavior that ships with AGP 9.
# Starting from AGP 10.x these opt outs will be removed.
android.builtInKotlin=false
android.newDsl=false